# LLM routing: task → provider/model. Change models here, never in code (ADR-0004).
# All providers are OpenAI-compatible. Free-tier quotas are per model, so phases are spread
# across different models. Check current model availability — the open-weight landscape moves fast.
providers:
  ollama: { base_url_env: QUALIFAI_OLLAMA_BASE_URL }
  groq:   { base_url_env: QUALIFAI_GROQ_BASE_URL, api_key_env: QUALIFAI_GROQ_API_KEY }
  vllm:   { base_url_env: QUALIFAI_VLLM_BASE_URL }

tasks:
  # Phase 1 — Prep (large; slow is fine)
  intake_gate:         { provider: ollama, model: "gemma4:e2b-it-qat", temperature: 0.0, max_tokens: 300 }
  resume_extract:      { provider: groq,   model: "openai/gpt-oss-120b", temperature: 0.0, max_tokens: 2500 }
  jd_extract:          { provider: groq,   model: "openai/gpt-oss-120b", temperature: 0.0, max_tokens: 1500 }
  topic_selection:     { provider: groq,   model: "openai/gpt-oss-120b", temperature: 0.2, max_tokens: 1500 }
  topic_pack:          { provider: groq,   model: "openai/gpt-oss-120b", temperature: 0.3, max_tokens: 900 }
  # Phase 2 — Live (fast)
  turn_analyzer:       { provider: groq,   model: "openai/gpt-oss-20b",  temperature: 0.0, max_tokens: 400, timeout_s: 15 }
  question_gen:        { provider: ollama, model: "gemma4:e2b-it-qat", temperature: 0.6, max_tokens: 150, timeout_s: 15 }
  coding_helper:       { provider: groq,   model: "openai/gpt-oss-20b",  temperature: 0.2, max_tokens: 400 }
  # Phase 3 — Evaluation (quality matters most)
  topic_eval:          { provider: groq,   model: "qwen/qwen3.8-27b",    temperature: 0.0, max_tokens: 1200 }
  code_review:         { provider: ollama, model: "qwen2.5-coder:14b",   temperature: 0.0, max_tokens: 1000 }
  contradiction_check: { provider: groq,   model: "openai/gpt-oss-20b",  temperature: 0.0, max_tokens: 500 }
  report_narrative:    { provider: groq,   model: "openai/gpt-oss-20b",  temperature: 0.4, max_tokens: 900 }
