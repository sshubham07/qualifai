[project]
name = "qualifai"
version = "0.1.0"
description = "Adaptive, resume-aware technical interviews — run by software, not just a prompt."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shubham Kumar Gupta" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "openai>=1.40",            # OpenAI-compatible client used for Ollama / Groq / vLLM — no OpenAI dependency
  "tenacity>=8.5",
  "httpx>=0.27",
  "pymupdf>=1.24",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "structlog>=24.1",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "boto3>=1.34",             # S3-compatible object storage (MinIO locally)
  "uuid6>=2024.1",           # UUIDv7 ids
  "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "testcontainers[postgres,redis]>=4.8",
  "pre-commit>=3.8",
  "types-PyYAML",
]
load = ["locust>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qualifai"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT"]
ignore = ["S101", "PT018", "RUF001", "RUF002", "RUF003"]  # asserts ok; unicode arrows/× intended

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]
".claude/hooks/**" = ["S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["migrations/"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "unit: fast, pure, no I/O (default level)",
  "architecture: import-boundary / design-rule tests",
  "contract: LLM structured-output contracts against recorded fixtures",
  "integration: real Postgres/Redis via testcontainers",
  "e2e: full interview flow through the API with a fake LLM",
  "evals: LLM judgment-quality evals (slow, needs a model)",
  "security: sandbox / injection / authz checks",
]

[tool.coverage.run]
source = ["src/qualifai"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

# ---------------------------------------------------------------- import-linter
# Architecture fitness rules — the deterministic core must never depend on LLMs or infra.
[tool.importlinter]
root_package = "qualifai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Policy, time and scoring are deterministic (no LLM / LangGraph / DB imports)"
type = "forbidden"
source_modules = [
  "qualifai.interview.policy",
  "qualifai.interview.time_window",
  "qualifai.interview.coverage",
  "qualifai.eval.aggregation",
  "qualifai.eval.verdict",
  "qualifai.eval.evidence_check",
]
forbidden_modules = ["qualifai.llm", "qualifai.db", "langgraph", "openai", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Only the llm package talks to model providers"
type = "forbidden"
source_modules = ["qualifai.prep", "qualifai.interview", "qualifai.eval", "qualifai.api"]
forbidden_modules = ["openai"]
allow_indirect_imports = true  # going through qualifai.llm is exactly what we want

[[tool.importlinter.contracts]]
name = "Layering: api -> services -> domain"
type = "layers"
layers = [
  "qualifai.api",
  "qualifai.workers",
  "qualifai.prep | qualifai.interview | qualifai.eval | qualifai.coding",
  "qualifai.llm | qualifai.db | qualifai.content",
  "qualifai.domain",
]
