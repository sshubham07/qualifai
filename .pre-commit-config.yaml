repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture rules)
        entry: lint-imports
        language: system
        pass_filenames: false
